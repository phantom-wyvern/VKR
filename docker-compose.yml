services:
  postgres:
    image: postgres:16-alpine
    container_name: library_db
    restart: always
    environment:
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: library_system
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_user -d library_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./library-back
      dockerfile: Dockerfile
    container_name: library_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://library_user:secure_password_123@postgres:5432/library_system
      SECRET_KEY: your_super_secret_key_change_in_production_12345
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    volumes:
      - ./library-back:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./library-front
      dockerfile: Dockerfile
    container_name: library_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./library-front:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=/api

  pgadmin:
    image: dpage/pgadmin4
    container_name: library_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@library.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pg_data: